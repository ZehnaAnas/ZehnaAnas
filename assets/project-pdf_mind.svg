<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Project pdf_mind: ask questions, get answers grounded in your PDFs"><title>Project pdf_mind: ask questions, get answers grounded in your PDFs</title><style>
text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

